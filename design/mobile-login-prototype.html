<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>移动端登录 · 原型与设计说明</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #0f1219;
      --bg-panel: #161b26;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8ecf4;
      --text-muted: #8b95a8;
      --accent: #6c8cff;
      --accent-soft: rgba(108, 140, 255, 0.18);
      --success: #3dd68c;
      --danger: #ff6b7a;
      --phone-frame: #1a2030;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      --font: "DM Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 10% -10%, rgba(108, 140, 255, 0.12), transparent),
        radial-gradient(800px 400px at 100% 20%, rgba(61, 214, 140, 0.06), transparent),
        var(--bg-page);
      color: var(--text);
      line-height: 1.5;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 380px) minmax(320px, 1fr);
      gap: 2rem;
      max-width: 1120px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        justify-items: center;
      }
      .spec {
        max-width: 420px;
      }
    }

    /* Phone chrome */
    .phone-wrap {
      position: sticky;
      top: 2rem;
    }

    .phone {
      width: min(100%, 360px);
      background: linear-gradient(165deg, #222a3a 0%, var(--phone-frame) 40%);
      border-radius: 36px;
      padding: 14px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
    }

    .phone-notch {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .phone-notch span {
      width: 96px;
      height: 28px;
      background: #0a0d12;
      border-radius: 20px;
    }

    .screen {
      background: linear-gradient(180deg, #f4f6fb 0%, #eef1f8 100%);
      border-radius: 28px;
      overflow: hidden;
      min-height: 560px;
      position: relative;
    }

    /* Login screen (light theme inside phone) */
    .login {
      padding: 28px 24px 32px;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      color: #1a1f2e;
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .login-logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 8px 24px rgba(108, 140, 255, 0.35);
    }

    .login-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .login-sub {
      margin: 4px 0 28px;
      font-size: 14px;
      color: #6b7289;
    }

    .field {
      margin-bottom: 10px;
    }

    .input-wrap {
      position: relative;
      background: #fff;
      border: 1.5px solid #e2e6ef;
      border-radius: var(--radius-md);
      padding: 18px 14px 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field-label {
      position: absolute;
      top: -9px;
      left: 12px;
      padding: 0 6px;
      font-size: 12px;
      font-weight: 600;
      color: #6b7289;
      background: #fff;
      line-height: 1.2;
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }

    .input-inner {
      display: flex;
      align-items: center;
      min-height: 24px;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .input-wrap:focus-within .field-label {
      color: var(--accent);
    }

    .input-wrap.error {
      border-color: var(--danger);
      box-shadow: 0 0 0 4px rgba(255, 107, 122, 0.15);
    }

    .input-wrap.error .field-label {
      color: var(--danger);
    }

    .input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0;
      font-size: 16px;
      font-family: inherit;
      color: #1a1f2e;
      outline: none;
      min-width: 0;
    }

    .input-wrap input:focus {
      outline: none;
    }

    .input-wrap input::placeholder {
      color: #a8b0c4;
    }

    .toggle-pw {
      border: none;
      background: transparent;
      padding: 0 14px;
      cursor: pointer;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
    }

    .toggle-pw:active {
      opacity: 0.7;
    }

    .field-hint {
      font-size: 12px;
      margin-top: 4px;
      min-height: 16px;
      color: var(--danger);
    }

    .row-pre-login {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 18px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #4b5569;
      cursor: pointer;
      user-select: none;
    }

    .remember-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .forgot-pw {
      font-size: 13px;
    }

    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 18px;
      cursor: pointer;
      user-select: none;
    }

    .check-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      flex-shrink: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .check-row-text {
      font-size: 12px;
      line-height: 1.5;
      color: #6b7289;
    }

    .check-row-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .check-row-text a:hover {
      text-decoration: underline;
    }

    .check-hint {
      font-size: 12px;
      margin: -12px 0 14px 28px;
      min-height: 18px;
      color: var(--danger);
    }

    .row-actions {
      display: flex;
      justify-content: flex-end;
      margin: -4px 0 22px;
    }

    .link {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary {
      width: 100%;
      border: none;
      border-radius: var(--radius-md);
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: linear-gradient(135deg, var(--accent) 0%, #7c6bff 100%);
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(108, 140, 255, 0.35);
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    }

    .btn-primary:hover {
      filter: brightness(1.05);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .demo-link-wrap {
      margin-top: 14px;
      text-align: center;
    }

    .demo-link-wrap .link {
      font-size: 12px;
      color: #8b95a8;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(26, 31, 46, 0.92);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Spec panel */
    .spec {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem 1.5rem 1.75rem;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
    }

    .spec h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }

    .spec .meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .spec-section {
      margin-bottom: 1rem;
    }

    .spec-section h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin: 0 0 0.5rem;
      font-weight: 600;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      font-family: inherit;
    }

    .chip:hover {
      border-color: rgba(108, 140, 255, 0.45);
      background: rgba(108, 140, 255, 0.08);
    }

    .chip:active {
      transform: scale(0.97);
    }

    .chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #c8d4ff;
    }

    .spec-detail {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid var(--border);
      min-height: 4.5em;
      transition: border-color 0.2s;
    }

    .spec-detail strong {
      color: var(--text);
    }

    .spec-detail.highlight {
      border-color: rgba(108, 140, 255, 0.5);
      color: #b4bfd4;
    }

    .legend {
      display: grid;
      gap: 8px;
      margin-top: 1rem;
      font-size: 13px;
      color: var(--text-muted);
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-a { background: var(--accent); }
    .dot-s { background: var(--success); }
    .dot-d { background: var(--danger); }

    .page-title {
      text-align: center;
      padding: 1.5rem 1rem 0;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <p class="page-title">Memorandum · 移动端登录原型（可点击右侧标签查看说明，左侧为可交互界面）</p>

  <div class="layout">
    <div class="phone-wrap">
      <div class="phone" id="phone">
        <div class="phone-notch"><span></span></div>
        <div class="screen">
          <form class="login" id="loginForm" novalidate>
            <div class="login-brand">
              <div class="login-logo">M</div>
              <div>
                <h1 class="login-title">欢迎回来</h1>
              </div>
            </div>
            <p class="login-sub">使用账号与密码登录 Memorandum</p>

            <div class="field" data-spec="account">
              <div class="input-wrap" id="accountWrap">
                <label for="account" class="field-label">账号</label>
                <div class="input-inner">
                  <input
                    id="account"
                    name="account"
                    type="text"
                    autocomplete="username"
                    placeholder="手机号 / 邮箱 / 用户名"
                    maxlength="64"
                  />
                </div>
              </div>
              <div class="field-hint" id="accountHint" aria-live="polite"></div>
            </div>

            <div class="field" data-spec="password">
              <div class="input-wrap" id="passwordWrap">
                <label for="password" class="field-label">密码</label>
                <div class="input-inner">
                  <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="请输入密码"
                    maxlength="128"
                  />
                  <button type="button" class="toggle-pw" id="togglePw" aria-pressed="false">显示</button>
                </div>
              </div>
              <div class="field-hint" id="passwordHint" aria-live="polite"></div>
            </div>

            <div class="row-pre-login">
              <label class="remember-label">
                <input type="checkbox" id="rememberMe" name="rememberMe" />
                <span>记住密码</span>
              </label>
              <button type="button" class="link forgot-pw" id="forgotPw">忘记密码？</button>
            </div>

            <label class="check-row" for="agreeTerms">
              <input type="checkbox" id="agreeTerms" name="agreeTerms" />
              <span class="check-row-text">
                我已阅读并同意<a href="#" onclick="return false">《服务条款》</a>与<a href="#" onclick="return false">《隐私政策》</a>
              </span>
            </label>
            <div class="check-hint" id="agreeHint" aria-live="polite"></div>

            <button type="submit" class="btn-primary" id="submitBtn">登录</button>

            <div class="demo-link-wrap">
              <button type="button" class="link" id="demoFill">填入演示数据</button>
            </div>
          </form>
          <div class="toast" id="toast" role="status"></div>
        </div>
      </div>
    </div>

    <aside class="spec" aria-label="设计说明">
      <h1>原型设计说明</h1>
      <p class="meta">375 逻辑宽度 · 浅色内容区 · 深色说明面板 · 点击标签联动高亮</p>

      <div class="spec-section">
        <h2>模块导航（可点击）</h2>
        <div class="chip-list" id="chipList">
          <button type="button" class="chip active" data-key="overview">整体布局</button>
          <button type="button" class="chip" data-key="account">账号输入</button>
          <button type="button" class="chip" data-key="password">密码输入</button>
          <button type="button" class="chip" data-key="cta">主按钮</button>
          <button type="button" class="chip" data-key="feedback">反馈与动效</button>
        </div>
      </div>

      <p class="spec-detail highlight" id="specDetail"></p>

      <div class="legend">
        <span><i class="dot dot-a"></i> 主色用于焦点、链接、主按钮</span>
        <span><i class="dot dot-s"></i> 成功态用于登录完成提示</span>
        <span><i class="dot dot-d"></i> 错误态用于校验与边框提示</span>
      </div>
    </aside>
  </div>

  <script>
    (function () {
      const specs = {
        overview:
          "<strong>整体布局：</strong>账号密码下方为「记住密码」与「忘记密码？」左右分布；再下方为服务条款勾选；最后为全宽登录按钮。链接与条款名使用主色蓝色，需手动勾选协议后方可登录。",
        account:
          "<strong>账号输入：</strong>标签嵌入边框左上方（白底切断边框线）；聚焦时边框与标签同步变蓝，并带 4px 柔光。两个输入框间距已收紧。",
        password:
          "<strong>密码输入：</strong>默认 password 类型；右侧「显示/隐藏」为辅助交互，不改变「仅账号密码登录」的产品定义。聚焦态与账号一致，保持系统感。",
        cta:
          "<strong>主按钮：</strong>渐变主色 + 适度投影，hover 微提亮，active 缩放 0.98 提供触感反馈。提交时 disabled + 文案「登录中…」模拟网络请求（演示 1.2s），避免重复提交。",
        feedback:
          "<strong>反馈与动效：</strong>校验错误时输入框边框变红并显示文案；成功时底部 Toast 上浮淡入。动效时长控制在 200–250ms，避免拖沓。",
      };

      const specDetail = document.getElementById("specDetail");
      const chips = document.querySelectorAll(".chip");
      const account = document.getElementById("account");
      const password = document.getElementById("password");
      const accountWrap = document.getElementById("accountWrap");
      const passwordWrap = document.getElementById("passwordWrap");
      const accountHint = document.getElementById("accountHint");
      const passwordHint = document.getElementById("passwordHint");
      const togglePw = document.getElementById("togglePw");
      const form = document.getElementById("loginForm");
      const submitBtn = document.getElementById("submitBtn");
      const toast = document.getElementById("toast");
      const demoFill = document.getElementById("demoFill");
      const agreeTerms = document.getElementById("agreeTerms");
      const agreeHint = document.getElementById("agreeHint");
      const forgotPw = document.getElementById("forgotPw");

      function setSpec(key) {
        specDetail.innerHTML = specs[key] || specs.overview;
        chips.forEach((c) => c.classList.toggle("active", c.dataset.key === key));
        specDetail.classList.add("highlight");
      }

      specDetail.innerHTML = specs.overview;

      chips.forEach((chip) => {
        chip.addEventListener("click", () => setSpec(chip.dataset.key));
      });

      togglePw.addEventListener("click", () => {
        const isPw = password.type === "password";
        password.type = isPw ? "text" : "password";
        togglePw.textContent = isPw ? "隐藏" : "显示";
        togglePw.setAttribute("aria-pressed", isPw ? "true" : "false");
        setSpec("password");
      });

      forgotPw.addEventListener("click", () => {
        flashToast("演示：跳转至找回密码页");
      });

      agreeTerms.addEventListener("change", () => {
        if (agreeTerms.checked) agreeHint.textContent = "";
      });

      demoFill.addEventListener("click", () => {
        account.value = "demo@memorandum.app";
        password.value = "Memorandum#2026";
        accountWrap.classList.remove("error");
        passwordWrap.classList.remove("error");
        accountHint.textContent = "";
        passwordHint.textContent = "";
        setSpec("overview");
        flashToast("已填入演示账号密码，可直接点登录");
      });

      function flashToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(flashToast._t);
        flashToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        let ok = true;
        accountHint.textContent = "";
        passwordHint.textContent = "";
        agreeHint.textContent = "";
        accountWrap.classList.remove("error");
        passwordWrap.classList.remove("error");

        if (!account.value.trim()) {
          accountHint.textContent = "请输入账号";
          accountWrap.classList.add("error");
          ok = false;
        }
        if (!password.value) {
          passwordHint.textContent = "请输入密码";
          passwordWrap.classList.add("error");
          ok = false;
        }
        if (!agreeTerms.checked) {
          agreeHint.textContent = "请先勾选同意服务条款与隐私政策";
          ok = false;
        }
        if (!ok) {
          setSpec("feedback");
          return;
        }

        submitBtn.disabled = true;
        const prev = submitBtn.textContent;
        submitBtn.textContent = "登录中…";
        setSpec("cta");

        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = prev;
          flashToast("演示成功：已验证格式（非真实接口）");
          setSpec("feedback");
        }, 1200);
      });

      account.addEventListener("focus", () => setSpec("account"));
      password.addEventListener("focus", () => setSpec("password"));
      submitBtn.addEventListener("focus", () => setSpec("cta"));
    })();
  </script>
</body>
</html>
